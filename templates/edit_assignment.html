<!DOCTYPE html>
<html>
<head>
    <title>Edit Assignment</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
        }

        .header {
            background: #2563eb;
            color: white;
            padding: 20px 30px;
        }

        .header h1 {
            margin: 0;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 30px auto;
        }

        .box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 12px #ddd;
        }

        h2 {
            color: #1e293b;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        select {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #1d4ed8;
        }

        .message {
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 6px;
            font-weight: bold;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
            border: 1px solid #fca5a5;
        }

        .success {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #86efac;
        }

        .back {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        .back:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="header">
    <h1>Edit Invigilator Assignment</h1>
</div>

<div class="container">

    <div class="box">

        <h2>Update Assignment</h2>

        {% if message %}
            <div class="message {{ message_type }}">
                {{ message }}
            </div>
        {% endif %}


        <form action="/update_assignment/{{ assignment[0] }}" method="POST">

            <label>Select Invigilator</label>

            <select name="invigilator_id" required>

                <option value="">
                    -- Select Invigilator --
                </option>

                {% for invigilator in invigilators %}

                    <option
                        value="{{ invigilator[0] }}"
                        {% if invigilator[0] == assignment[1] %}
                            selected
                        {% endif %}
                    >
                        {{ invigilator[1] }} - {{ invigilator[2] }}
                    </option>

                {% endfor %}

            </select>


            <label>Select Examination Hall</label>

            <select name="hall_id" required>

                <option value="">
                    -- Select Hall --
                </option>

                {% for hall in halls %}

                    <option
                        value="{{ hall[0] }}"
                        {% if hall[0] == assignment[2] %}
                            selected
                        {% endif %}
                    >
                        {{ hall[1] }} - Room {{ hall[2] }}
                    </option>

                {% endfor %}

            </select>


            <button type="submit">
                Update Assignment
            </button>

        </form>


        <a class="back" href="/assign_invigilator">
            ← Back to Assignment
        </a>

    </div>

</div>

</body>
</html>
