<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Seat Allocation</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        .header {
            background: #111827;
            color: white;
            padding: 22px 40px;
            font-size: 25px;
            font-weight: bold;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 50px auto;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }

        h2 {
            margin-top: 0;
            color: #111827;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 8px;
            font-weight: bold;
            color: #374151;
        }

        select,
        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        select:focus,
        input:focus {
            border-color: #2563eb;
        }

        .buttons {
            margin-top: 30px;
            display: flex;
            gap: 12px;
        }

        button {
            border: none;
            padding: 13px 24px;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .back {
            text-decoration: none;
            padding: 13px 24px;
            border-radius: 8px;
            background: #6b7280;
            color: white;
        }

        .back:hover {
            background: #4b5563;
        }

    </style>

</head>

<body>

    <div class="header">
        🏫 Examination Hall Management
    </div>

    <div class="container">

        <div class="card">

            <h2>✏️ Edit Seat Allocation</h2>

            <p class="subtitle">
                Update the student's examination hall and seat.
            </p>

            <form
                method="POST"
                action="/update_seat_allocation/{{ allocation[0] }}"
            >

                <label>
                    Student
                </label>

                <select name="student_id" required>

                    {% for student in students %}

                    <option
                        value="{{ student[0] }}"
                        {% if student[0] == allocation[1] %}
                        selected
                        {% endif %}
                    >

                        {{ student[1] }} -
                        {{ student[2] }}

                    </option>

                    {% endfor %}

                </select>


                <label>
                    Examination Hall
                </label>

                <select name="hall_id" required>

                    {% for hall in halls %}

                    <option
                        value="{{ hall[0] }}"
                        {% if hall[0] == allocation[4] %}
                        selected
                        {% endif %}
                    >

                        {{ hall[1] }}
                        -
                        Room {{ hall[2] }}
                        -
                        Capacity {{ hall[3] }}

                    </option>

                    {% endfor %}

                </select>


                <label>
                    Seat Number
                </label>

                <input
                    type="text"
                    name="seat_no"
                    value="{{ allocation[7] }}"
                    placeholder="Example: S1"
                    required
                >


                <div class="buttons">

                    <button type="submit">
                        💾 Update Allocation
                    </button>

                    <a
                        href="/seat_allocation"
                        class="back"
                    >
                        ← Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</body>

</html>
