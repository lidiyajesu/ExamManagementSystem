<!DOCTYPE html>
<html>
<head>

    <title>Edit Hall</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
        }

        .header {
            background: #2563eb;
            color: white;
            padding: 20px 30px;
        }

        .header h1 {
            margin: 0;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 30px auto;
        }

        .box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 12px #ddd;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .back {
            display: block;
            margin-top: 15px;
            text-align: center;
            color: #2563eb;
            text-decoration: none;
        }

    </style>

</head>

<body>

    <div class="header">
        <h1>Edit Examination Hall</h1>
    </div>

    <div class="container">

        <div class="box">

            <h2>Update Hall Details</h2>

            <form action="/update_hall/{{ hall[0] }}" method="POST">

                <label>Hall Name</label>

                <input
                    type="text"
                    name="hall_name"
                    value="{{ hall[1] }}"
                    required
                >

                <label>Room Number</label>

                <input
                    type="text"
                    name="room_no"
                    value="{{ hall[2] }}"
                    required
                >

                <label>Capacity</label>

                <input
                    type="number"
                    name="capacity"
                    value="{{ hall[3] }}"
                    required
                >

                <button type="submit">
                    Update Hall
                </button>

            </form>

            <a class="back" href="/halls">
                ← Back to Hall Management
            </a>

        </div>

    </div>

</body>
</html>
